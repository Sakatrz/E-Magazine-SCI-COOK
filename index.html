<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Cook E-Magazine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="magazine-wrapper">
    <div id="page-container">
      <img id="page-image" src="" alt="Halaman e-magazine">
      <!-- trigger transparan digenerate otomatis lewat script.js -->
    </div>
  </div>

  <!-- Pop up untuk teks yang bisa diklik -->
  <div id="popup-overlay" class="hidden">
    <div id="popup-box">
      <button id="popup-close" aria-label="Tutup">&times;</button>
      <h2 id="popup-title"></h2>
      <p id="popup-body"></p>
    </div>
  </div>

  <script src="pages-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
