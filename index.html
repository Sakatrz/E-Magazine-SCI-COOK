<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="E-Magazine SCI-COOK - Majalah digital interaktif sains dan kuliner">
  <title>E-Magazine SCI-COOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header id="site-header">
    <div id="header-left">
      <div id="header-logo">
        <div id="header-titles">
          <h1 id="header-title">E-Magazine SCI-COOK</h1>
        </div>
      </div>
    </div>

    <div id="header-toolbar">
      <!-- Navigasi Halaman -->
      <div class="toolbar-group" id="nav-group">
        <div id="page-indicator">
          <input id="page-input" type="text" value="1" title="Ketik nomor halaman lalu tekan Enter" autocomplete="off">
          <span class="page-sep">/</span>
          <span id="total-pages">1</span>
        </div>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Zoom -->
      <div class="toolbar-group" id="zoom-group">
        <button class="tool-btn" id="btn-zoom-out" title="Perkecil (Zoom Out)" onclick="handleZoom(-0.1)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
        <button class="tool-btn" id="btn-zoom-reset" title="Reset Zoom (100%)" onclick="handleZoom(0)">100%</button>
        <button class="tool-btn" id="btn-zoom-in" title="Perbesar (Zoom In)" onclick="handleZoom(0.1)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Fullscreen -->
      <div class="toolbar-group">
        <button class="tool-btn" id="btn-fullscreen" title="Layar Penuh" onclick="handleFullscreen()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <!-- ===== END HEADER ===== -->

  <main id="magazine-main">
    <div id="magazine-wrapper">
      <div id="page-container">
        <!-- Loader indikator saat gambar belum selesai diunduh -->
        <div id="page-loader" class="page-loader hidden">
          <div class="page-spinner"></div>
          <span class="loader-text">Memuat halaman...</span>
        </div>
        <img id="page-image" src="" alt="Halaman e-magazine">
        <!-- trigger transparan digenerate otomatis lewat script.js -->
      </div>
    </div>
  </main>

  <!-- Pop up untuk teks yang bisa diklik -->
  <div id="popup-overlay" class="hidden">
    <div id="popup-box">
      <button id="popup-close" aria-label="Tutup">&times;</button>
      <h2 id="popup-title"></h2>
      <p id="popup-body"></p>
    </div>
  </div>

  <script src="pages-data.js"></script>
  <script src="script.js"></script>
</body>

</html>
